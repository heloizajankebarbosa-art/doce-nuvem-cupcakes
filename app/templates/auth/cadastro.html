{% extends "base.html" %}
{% block titulo %}Criar conta · Doce Nuvem{% endblock %}
{% block conteudo %}
<section class="caixa-form">
  <h1>Criar conta</h1>
  <form method="post" novalidate data-validar>
    <label for="nome">Nome completo *</label>
    <input id="nome" name="nome" value="{{ dados.nome or '' }}" required minlength="3" autocomplete="name">
    <label for="email">E-mail *</label>
    <input id="email" type="email" name="email" value="{{ dados.email or '' }}" required autocomplete="email">
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" value="{{ dados.telefone or '' }}" placeholder="(11) 99999-9999" autocomplete="tel">
    <label for="endereco">Endereço para entrega</label>
    <input id="endereco" name="endereco" value="{{ dados.endereco or '' }}" placeholder="Rua, número, bairro, cidade" autocomplete="street-address">
    <label for="senha">Senha * <small>(mínimo 6 caracteres)</small></label>
    <input id="senha" type="password" name="senha" required minlength="6" autocomplete="new-password">
    <label for="confirmacao">Confirme a senha *</label>
    <input id="confirmacao" type="password" name="confirmacao" required minlength="6" autocomplete="new-password">
    <button class="botao botao-cheio" type="submit">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
