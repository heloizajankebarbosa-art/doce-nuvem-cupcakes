{% extends "base.html" %}
{% block titulo %}Entrar · Doce Nuvem{% endblock %}
{% block conteudo %}
<section class="caixa-form">
  <h1>Entrar</h1>
  <form method="post" novalidate data-validar>
    <label for="email">E-mail</label>
    <input id="email" type="email" name="email" value="{{ email }}" required autocomplete="email">
    <label for="senha">Senha</label>
    <input id="senha" type="password" name="senha" required autocomplete="current-password">
    <button class="botao botao-cheio" type="submit">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
